name: Deploy Preview

on:
  push:
    branches:
      - '**'
      - '!main'

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run build

      # Worker Previews (`wrangler preview`, GA 2026-09-22) in place of
      # `wrangler versions upload`. Previews give a branch a stable URL that
      # every push updates, plus isolated config/state/observability, where
      # Version URLs only ever pointed at production resources.
      # The CLI still labels the command "private beta"; this account has
      # access, so treat that label as stale rather than as a blocker.
      # Preview names must be hostname-safe, so slashes in branch names are
      # flattened rather than relying on the git-branch default.
      - name: Deploy branch preview
        id: upload
        run: |
          set -o pipefail
          PREVIEW_NAME=$(printf '%s' "$BRANCH" | tr -c 'a-zA-Z0-9' '-' | sed 's/--*/-/g; s/^-//; s/-$//')
          echo "Preview name: $PREVIEW_NAME"
          # --json is parsed first; the human output is kept for the log and
          # used as a fallback, since the JSON shape is not pinned down yet.
          bunx wrangler preview --name "$PREVIEW_NAME" --json > preview_output.json 2> preview_stderr.txt || STATUS=$?
          cat preview_stderr.txt
          cat preview_output.json
          if [ -n "${STATUS:-}" ]; then
            echo "::error::wrangler preview exited with status $STATUS"
            exit "$STATUS"
          fi
          PREVIEW_URL=$(jq -r '[.. | strings | select(startswith("https://") and contains("workers.dev"))] | first // empty' preview_output.json 2>/dev/null || true)
          if [ -z "$PREVIEW_URL" ]; then
            PREVIEW_URL=$(grep -oh 'https://[a-zA-Z0-9.-]*\.workers\.dev' preview_output.json preview_stderr.txt | head -1 || true)
          fi
          if [ -z "$PREVIEW_URL" ]; then
            echo "::error::wrangler preview produced no URL, so there is nothing to preview. See the output above for the shape it actually returned."
            exit 1
          fi
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
        env:
          BRANCH: ${{ github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # No `if:` guard here on purpose: the upload step now fails outright when
      # no URL is found, so an empty PREVIEW_URL can no longer skip this step
      # and leave the job green with nothing to preview.
      - name: Add preview URL to summary
        run: |
          echo "## 🚀 Preview Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Preview URL:** ${{ steps.upload.outputs.PREVIEW_URL }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
