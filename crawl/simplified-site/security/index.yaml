        children:
          - tag: h1
            text: AppMap Security FAQ
          - tag: div
            children:
              - tag: ol
                children:
                  - tag: li
                    children:
                      - tag: h4
                        text: Will AppMap move code or data off of my personal dev environment?
                      - tag: p
                        text: If you are generating code maps, NO. AppMap runtime recordings and diagrams are created and stored locally on your machine, all graphs and visualizations of code are stored locally in your code editor...
                      - tag: p
                        text: If you are using AppMap integrations, YES. Users integrating AppMap with Confluence or using AppMap AI integrations including Navie involve moving AppMap json and/or code snippets from your code edito...
                      - tag: p
                        text: To learn more about Navie’s data architecture
                        children:
                          - tag: a
                            text: see the diagram below.
                            attributes:
                              href: '#appmap-navie-architecture-diagram'
                  - tag: li
                    children:
                      - tag: h4
                        text: Is sign in required to use AppMap?
                      - tag: p
                        text: Authorization via GitHub, GitLab, or email is required to activate AppMap, and start using AppMap in your code editor.
                  - tag: li
                    children:
                      - tag: h4
                        text: Does activating via GitHub or GitLab give AppMap access to my code repository?
                      - tag: p
                        text: No. GitHub and GitLab are used as OAuth providers only. This allows AppMap to verify your identity, but does not grant access to code hosted with GitHub or GitLab.
                  - tag: li
                    children:
                      - tag: h4
                        text: What scope does AppMap access to authenticate users via GitHub or GitLab?
                      - tag: h5
                        text: For authentication with GitHub
                      - tag: ul
                        children:
                          - tag: li
                            text: Read access user email addresses ()
                            children:
                              - tag: a
                                text: GitHub docs
                                attributes:
                                  href: https://docs.github.com/en/apps/oauth-apps/building-oauth-apps/scopes-for-oauth-apps#:~:text=user%27s%20profile%20data.-,user%3Aemail,-Grants%20read%20access
                      - tag: h5
                        text: For authentication with GitLab
                      - tag: ul
                        children:
                          - tag: li
                            text: Read the authenticated user's personal information. Grants read-only access to the authenticated user's profile through the /user API endpoint, which includes username, public email, and full name. Al...
                            children:
                              - tag: a
                                text: GitLab docs
                                attributes:
                                  href: https://docs.gitlab.com/ee/integration/oauth_provider.html#:~:text=the%20package%20registry.-,read_user,-Grants%20read%2Donly
                      - tag: p
                        text: AppMap does not require any permissions to your web hosted code.
                  - tag: li
                    children:
                      - tag: h4
                        text: Where are AppMap files stored?
                      - tag: p
                        text: AppMap files are stored in your local development project, typically in a directory within your project, created during the installation process.
                        children:
                          - tag: code
                            text: tmp/appmap
                      - tag: p
                        text: AppMap does not upload or move your AppMap files out of your local environment.
                      - tag: p
                        text: For specifics regarding the location and configuration of AppMap files see the .
                        children:
                          - tag: a
                            text: reference section of our documentation
                            attributes:
                              href: /docs/reference/
                  - tag: li
                    children:
                      - tag: h4
                        text: What is AppMap's data architecture?
                      - tag: p
                        text: AppMap agents are libraries that get loaded into your application, and write data to the local filesystem based on the application's runtime behavior.
                      - tag: p
                        text: These files are then read by the , or in the case of a CI deployment, by the AppMap CI tools.
                        children:
                          - tag: a
                            text: AppMap code editor plugins
                            attributes:
                              href: /docs/get-started-with-appmap
                      - tag: p
                        text: The graphic below illustrates AppMap's data architecture.
                      - tag: p
                        children:
                          - tag: a
                            attributes:
                              href: /assets/img/product/appmap-architecture.webp
                            children:
                              - tag: img
                                attributes:
                                  src: /assets/img/product/appmap-architecture.webp
                                  alt: AppMap's data architecture
                      - tag: p
                        text: The graphic below illustrates AppMap Navie’s data architecture.
                      - tag: p
                        children:
                          - tag: a
                            attributes:
                              href: /assets/img/product/navie-architecture.webp
                            children:
                              - tag: img
                                attributes:
                                  src: /assets/img/product/navie-architecture.webp
                                  id: appmap-navie-architecture-diagram
                                  alt: AppMap's data architecture
                  - tag: li
                    children:
                      - tag: h4
                        text: Who should I contact regarding specific security concerns?
                      - tag: p
                        text: We are happy to answer any specific questions you may have. Reach out directly to an AppMap team member in our or send an email to .
                        children:
                          - tag: a
                            text: community Slack
                            attributes:
                              href: /slack
                          - tag: a
                            text: support@appmap.io
                            attributes:
                              href: mailto:support@appmap.io
