                              src: /assets/img/vscode-icon.svg
                              alt: Visual Studio Code logo
                          - tag: span
                            text: Visual Studio Code
                      - tag: p
                        text: AppMap is available in the marketplace as an extenstion for Visual Studio Code. Optionally, you can search for AppMap in the 'Extensions' tab of your code editor.
                        children:
                          - tag: a
                            text: Install via the VS Code marketplace.
                            attributes:
                              href: https://marketplace.visualstudio.com/items?itemName=appland.appmap
                  - tag: img
