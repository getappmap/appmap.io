                              src: /assets/img/jetbrains.svg
                              alt: JetBrains logo
                          - tag: span
                            text: JetBrains
                      - tag: p
                        text: AppMap is available in the marketplace as a plugin for JetBrains, PyCharm, IntelliJ, WebStorm, and RubyMine. Optionally, you can search for AppMap in the 'Plugins' tab of your code editor.
                        children:
                          - tag: a
                            text: Install via the JetBrains marketplace.
                            attributes:
                              href: https://plugins.jetbrains.com/plugin/16701-appmap
                  - tag: img
                    attributes:
                      src: /assets/img/intellij-ide.png
                      alt: AppMap for JetBrains
              - tag: div
