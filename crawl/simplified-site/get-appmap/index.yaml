                            attributes:
                              src: /assets/img/enterprise-icon.svg
                              alt: Generic enterprise icon
                          - tag: span
                            text: Enterprise Support
                      - tag: p
                        text: for advanced runtime analysis features for compliance and security, and administrative controls.
                        children:
