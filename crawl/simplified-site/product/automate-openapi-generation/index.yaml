              - tag: h1
                text: Automatically Generate OpenAPI Definitions
          - tag: h2
            children:
              - tag: b
                text: Your development time is valuable. Don’t spend it writing and maintaining OpenAPI definitions.
              - tag: p
                text: AppMap records all the HTTP API behavior in your application and automatically generates OpenAPI definitions. It works automatically in your code editor and in CI, keeping your definitions in sync wit...
      - tag: div
        children:
          - tag: h2
            text: Generate OpenAPI Definitions
          - tag: p
            text: Keeping definitions in sync and up to date with the API's latest behavior is time consuming and error prone. AppMap generates an OpenAPI spec automatically in your code editor or in CI. Save time writ...
          - tag: h2
            text: Maintain your OpenAPI Definitions
          - tag: p
            text: OpenAPI definitions generated by AppMap can be used for anything you would do as part of your normal workflow, including loading into tools like Postman, or readme.com.
          - tag: h2
            text: Diff API Changes
          - tag: p
            text: Once AppMap's has been integrated into your CI system, you can use it within your code review workflow to see the API behavior differences caused by each code change.
            children:
              - tag: b
                text: OpenAPI Generator
      - tag: div
        children:
          - tag: div
            children:
              - tag: h4
                text: Postman Integration with AppMap
              - tag: p
                text: AppMap allows developers to move to an API-first mode in almost no time. By creating OpenAPI definitions and updating them automatically in Postman, teams using AppMap can leverage all the valuable fe...
                children:
                  - tag: a
                    text: Read the full blog post on the Postman site.
                    attributes:
                      href: https://blog.postman.com/new-postman-integration-with-appmap-create-and-manage-always-accurate-collections/
          - tag: div
            children:
              - tag: h4
                text: Automatically Generate OpenAPI Definitions for Mastodon
              - tag: p
                text: A real world example of keeping API documentation up to date by automating OpenAPI generation, includes the command for running AppMap OpenAPI generation from CI.
                children:
                  - tag: a
                    text: Read the full blog post on dev.to.
                    attributes:
                      href: https://dev.to/appmap/automatically-generating-openapi-docs-for-mastodon-42ig
      - tag: div
        children:
          - tag: h2
            text: Get started for free
          - tag: p
            text: for your or , record AppMap Data, and start generating OpenAPI definitions.
            children:
              - tag: a
                text: Install the AppMap extension
                attributes:
                  href: /download
              - tag: b
                text: Visual Studio Code
              - tag: b
                text: JetBrains Code editor
      - tag: section
        children:
          - tag: div
            children:
              - tag: h2
                text: Your Data is Your Data
              - tag: p
                text: With AppMap your source code and data never have to leave your local development environment. Many new developer tools require you to upload source code and grant privileges to your repo, but AppMap d...
          - tag: div
            children:
              - tag: h2
                text: Join Our Community
              - tag: p
                text: If you have any questions about how this is done, or would like an AppMap developer to help you get up and running, feel free to , introduce yourself, and ping us!
                children:
                  - tag: a
                    text: drop into our Slack
                    attributes:
                      href: https://appmap.io/slack
