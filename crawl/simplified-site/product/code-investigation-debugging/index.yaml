                  alt: Follow request flows
              - tag: div
                children:
                  - tag: h2
                    text: Follow Request Flows
                  - tag: p
                    text: AppMap's view allows you to see the events that occurred in your application while AppMap was recording. Events are shown in chronological order within an interactive sequence view that allows for eas...
                    children:
                      - tag: strong
                        text: Sequence Diagram
                  - tag: p
                    text: The gives even deeper information about application behavior, allowing you to follow requests all the way through to your database and back. You'll see the values of function parameters, call timings,...
                    children:
                      - tag: strong
                        text: Trace View
          - tag: div
            children:
              - tag: img
                attributes:
                  src: /assets/img/product/examine-runtime-dependencies.jpg
                  alt: Examine runtime dependencies
              - tag: div
                children:
                  - tag: h2
                    text: Examine Runtime Dependencies
                  - tag: p
                    text: AppMap can visually represent all actually-used dependencies within an application. For example, if your Ruby application uses Rails, OpenSSL, and a PostgreSQL database, you will see each of those dep...
                    children:
                      - tag: strong
                        text: Dependency View
                  - tag: p
                    text: Importantly, only dependencies that are used by your application at runtime are shown by AppMap. This allows you to determine if, for example, a 3rd-party library with a known vulnerability is truly u...
      - tag: div
        children:
          - tag: h2
            text: Inspect Database Queries
          - tag: p
            text: AppMap makes it simple to see how your application interacts with SQL databases. You can quickly discover query inefficiencies and anti-patterns that pose hidden scalability and reliability risks even...
          - tag: p
            text: With AppMap, not only are trips to database logs no longer required to see the SQL commands, but the commands are also directly linked to the code that initiates their execution, helping you understan...
      - tag: section
        children:
          - tag: div
            children:
              - tag: h2
                text: View Your Application's Code Objects
              - tag: p
                text: AppMap automatically indexes your application's code objects (functions, APIs, DB queries) and presents them in an easily browsable and searchable catalog, right in your code editor.
              - tag: p
                text: Whether you're learning a new code base or trying to debug a production issue, having all the important parts of your application's runtime behavior available at your fingertips dramatically reduces e...
          - tag: div
            children:
              - tag: h2
                text: See What's Important, Not The Internals
              - tag: p
                text: AppMap knows how popular frameworks like Spring, Rails, Django, and Express work. That means that when you view an AppMap, you'll only see the important parts of how an API request is handled.
              - tag: p
                text: For example, instead of seeing dozens of internal events related to how a framework receives data over TCP, manages its thread pools, and unmarshals payloads, you'll instead see something simple like ...
                children:
                  - tag: code
                    text: HTTP POST
              - tag: p
                text: Since it knows how these frameworks operate internally, AppMap will also automatically label framework function calls that provide important services. For example, AppMap will apply the label to an Op...
                children:
                  - tag: code
                    text: crypto.decrypt
                  - tag: code
                    text: security.authentication
