                text: Code Investigation and Debugging
          - tag: h2
            text: AppMap can help you understand your application's behavior faster than you can possibly do with traditional methods like reading code or viewing stack traces. And when you have an issue to debug, AppM...
      - tag: section
        children:
          - tag: div
            children:
