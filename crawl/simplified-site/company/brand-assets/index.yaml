tag: body
children:
  - tag: div
    attributes:
      id: hs-banner-parent
    children:
      - tag: div
        attributes:
          id: hs-eu-cookie-confirmation
        children:
          - tag: div
            attributes:
              id: hs-eu-cookie-confirmation-inner
            children:
              - tag: div
                attributes:
                  id: hs-eu-header-container
                children:
                  - tag: button
                    attributes:
                      id: hs-eu-close-button
              - tag: div
                attributes:
                  id: hs-eu-policy-wording
                children:
                  - tag: p
                    text: This website stores cookies on your computer. These cookies are used to collect information about how you interact with our website and allow us to remember you. We use this information in order to im...
              - tag: p
                text: If you decline, your information won’t be tracked when you visit this website. A single cookie will be used in your browser to remember your preference not to be tracked.
                attributes:
                  id: hs-eu-cookie-disclaimer
              - tag: div
                attributes:
                  id: hs-eu-cookie-confirmation-buttons-area
                children:
                  - tag: div
                    attributes:
                      id: hs-eu-confirmation-button-group
                    children:
                      - tag: button
                        text: Cookies settings
                        attributes:
                          id: hs-eu-cookie-settings-button
                      - tag: div
                        attributes:
                          id: hs-eu-opt-in-buttons
                        children:
                          - tag: button
                            text: Accept
                            attributes:
                              id: hs-eu-confirmation-button
                          - tag: button
                            text: Decline
                            attributes:
                              id: hs-eu-decline-button
  - tag: p
    children:
