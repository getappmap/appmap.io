        children:
          - tag: h1
            text: Code of Conduct
          - tag: div
            children:
              - tag: h2
                text: Contributor Covenant Code of Conduct
              - tag: h4
                text: Our Pledge
              - tag: div
                text: We as members, contributors, and leaders pledge to make participation in our community a harassment-free experience for everyone, regardless of age, body size, visible or invisible disability, ethnici...
              - tag: div
                text: We pledge to act and interact in ways that contribute to an open, welcoming, diverse, inclusive, and healthy community.
              - tag: h4
                text: Our Standards
              - tag: p
                children:
                  - tag: strong
                    text: 'Examples of behavior that contributes to a positive environment for our community include:'
              - tag: ul
                children:
                  - tag: li
                    text: Demonstrating empathy and kindness toward other people
                  - tag: li
                    text: Being respectful of differing opinions, viewpoints, and experiences
                  - tag: li
                    text: Giving and gracefully accepting constructive feedback
                  - tag: li
                    text: Accepting responsibility and apologizing to those affected by our mistakes, and learning from the experience
                  - tag: li
                    text: Focusing on what is best not just for us as individuals, but for the overall community
              - tag: p
                children:
                  - tag: strong
                    text: 'Examples of unacceptable behavior include:'
              - tag: ul
                children:
                  - tag: li
                    text: The use of sexualized language or imagery, and sexual attention or advances of any kind
                  - tag: li
                    text: Trolling, insulting or derogatory comments, and personal or political attacks
                  - tag: li
                    text: Public or private harassment
                  - tag: li
                    text: Publishing others' private information, such as a physical or email address, without their explicit permission
                  - tag: li
                    text: Contacting individual members, contributors, or leaders privately, outside designated community mechanisms, without their explicit permission
                  - tag: li
                    text: Other conduct which could reasonably be considered inappropriate in a professional setting
              - tag: h4
                text: Enforcement Responsibilities
              - tag: div
                text: Community leaders are responsible for clarifying and enforcing our standards of acceptable behavior and will take appropriate and fair corrective action in response to any behavior that they deem inap...
              - tag: div
                text: Community leaders have the right and responsibility to remove, edit, or reject comments, commits, code, wiki edits, issues, and other contributions that are not aligned to this Code of Conduct, and wi...
              - tag: h4
                text: Scope
              - tag: p
                text: This Code of Conduct applies within all community spaces, and also applies when an individual is officially representing the community in public spaces. Examples of representing our community include ...
              - tag: h4
                text: Enforcement
              - tag: p
                text: Instances of abusive, harassing, or otherwise unacceptable behavior may be reported to the community leaders responsible for enforcement at opensource@github.com. All complaints will be reviewed and i...
              - tag: p
                text: All community leaders are obligated to respect the privacy and security of the reporter of any incident.
              - tag: h4
                text: Enforcement Guidelines
              - tag: p
                text: 'Community leaders will follow these Community Impact Guidelines in determining the consequences for any action they deem in violation of this Code of Conduct:'
              - tag: ol
                children:
                  - tag: li
                    children:
                      - tag: h5
                        text: Correction
                      - tag: div
                        text: Use of inappropriate language or other behavior deemed unprofessional or unwelcome in the community.
                        children:
                          - tag: strong
                            text: 'Community Impact:'
                      - tag: div
                        text: A private, written warning from community leaders, providing clarity around the nature of the violation and an explanation of why the behavior was inappropriate. A public apology may be requested.
                        children:
                          - tag: strong
                            text: 'Consequence:'
                  - tag: li
                    children:
                      - tag: h5
                        text: Warning
                      - tag: div
                        text: A violation through a single incident or series of actions.
                        children:
                          - tag: strong
                            text: 'Community Impact:'
                      - tag: div
                        text: A warning with consequences for continued behavior. No interaction with the people involved, including unsolicited interaction with those enforcing the Code of Conduct, for a specified period of time....
                        children:
                          - tag: strong
                            text: 'Consequence:'
                  - tag: li
                    children:
                      - tag: h5
                        text: Temporary Ban
                      - tag: div
                        text: A serious violation of community standards, including sustained inappropriate behavior.
                        children:
                          - tag: strong
                            text: 'Community Impact:'
                      - tag: div
                        text: A temporary ban from any sort of interaction or public communication with the community for a specified period of time. No public or private interaction with the people involved, including unsolicited...
                        children:
                          - tag: strong
                            text: 'Consequence:'
                  - tag: li
                    children:
                      - tag: h5
                        text: Permanent Ban
                      - tag: div
                        text: Demonstrating a pattern of violation of community standards, including sustained inappropriate behavior, harassment of an individual, or aggression toward or disparagement of classes of individuals.
                        children:
                          - tag: strong
                            text: 'Community Impact:'
                      - tag: div
                        text: A permanent ban from any sort of public interaction within the community.
                        children:
                          - tag: strong
                            text: 'Consequence:'
              - tag: h4
                text: Attribution
              - tag: div
                text: This Code of Conduct is adapted from the Contributor Covenant, version 2.0, available at https://www.contributor-covenant.org/version/2/0/code_of_conduct.html.
              - tag: div
                text: Community Impact Guidelines were inspired by Mozilla's code of conduct enforcement ladder.
              - tag: div
                text: For answers to common questions about this code of conduct, see the FAQ at https://www.contributor-covenant.org/faq.
              - tag: div
                text: Translations are available at https://www.contributor-covenant.org/translations.
